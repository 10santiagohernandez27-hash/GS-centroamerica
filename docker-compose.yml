version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: barbershop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=barbershop2024
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=tu-clave-secreta-cambiar-esto
      - GENERIC_TIMEZONE=America/Costa_Rica
      - TZ=America/Costa_Rica
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
      - ./data:/home/node/data
    networks:
      - barbershop-net
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: barbershop-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - barbershop-net

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: barbershop-whisper
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
    networks:
      - barbershop-net

volumes:
  n8n_data:
  ollama_data:

networks:
  barbershop-net:
    driver: bridge
